name: CI

on:
  push:
    branches: [main]
    # A tag publishes a release (#90): `release` at the bottom waits for `test` to pass on it first.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, since it needs nothing installed. A marker in a C file breaks the build loudly; one in
      # Markdown, JSON or a definition file's comment is silent until somebody reads it -- and before
      # #90, CHANGELOG.md was hand-merged on nearly every pull request. Over every tracked file, on
      # every run, so one that arrived by any route is caught.
      - name: No unresolved conflict markers
        run: scripts/check_conflict_markers.sh

      # Everything the build needs is in the checkout: the CLibs tarballs are committed under
      # third_party/clibs/ and unpacked locally. Nothing here reaches the network, and nothing here
      # needs a secret -- which is the point, since CLibs is private and the token a workflow is
      # given automatically cannot read another repository.
      # zsh is for the zsh half of `make test-completion`, which skips without it.
      # emacs-nox, vim and neovim are for `make test-editors' alone -- none of them is needed to
      # build, and each of those three halves skips with a message when its editor is absent, so a
      # contributor without one still runs everything else. All three are installed here because a
      # test that only ever skips in CI is a test nobody is running. jq, zip and unzip are for
      # `make vsix` below. apt's neovim is 0.7.2 on this image (`ubuntu-latest` here is node:22-bookworm,
      # Debian), too old for the `vim.lsp.start` the Neovim LSP test calls: that one test skips, and
      # says so, while the rest of the Neovim half still runs.
      #
      # Through scripts/ci_apt_get.sh rather than apt-get itself: concurrent jobs on this runner share
      # an apt proxy that can leave a plain apt-get hung for good (#79). The script bounds and retries
      # each call.
      - name: Install the toolchain
        run: |
          scripts/ci_apt_get.sh update -qq
          scripts/ci_apt_get.sh install -y -qq --no-install-recommends \
            build-essential emacs-nox vim-nox neovim zsh clang-format-22 jq zip unzip

      # Before the full build, so a formatting problem is reported without waiting on all of it. It does
      # build the tool itself: definition files are formatted by `frame-dsl --format`, not clang-format. The
      # pre-commit hook (.githooks/pre-commit) is a convenience that catches this earlier; this is
      # what actually enforces it, since a hook nobody installed or a --no-verify commit both reach
      # here regardless.
      #
      # The version is named rather than left to `clang-format`, which on this image is 14 -- old
      # enough that it cannot read .clang-format at all. clang-format-22 is what the style file needs
      # and what this image can install; a bare `clang-format` here fails every file with
      # "unknown key" and says nothing about why.
      - name: Check formatting
        run: make format-check CLANG_FORMAT=clang-format-22

      - name: Build
        run: make

      # Through scripts/cap_output.sh, so that nothing in the suite can print without end (#114). A
      # passing run prints well under 1,500 lines; before the non-PIE build (#80), a failing one printed
      # AddressSanitizer:DEADLYSIGNAL until it was killed -- 89 million lines, 5.3 GB of log on the
      # Forgejo instance from a single job. The Makefile already caps each sanitized run; this covers
      # whatever loops next, somewhere else. 50,000 lines is a few MB.
      - name: Run the test suite
        run: scripts/cap_output.sh 50000 make test

      # Built, not run: a timing on a shared runner means nothing, but a benchmark that no longer
      # compiles would only be noticed the next time somebody wanted a number. The same goes for the
      # performance baseline (#102), which is run by hand.
      - name: Build the benchmarks
        run: make build/bench build/baseline build/layout

      # The release archive (#128), built and checked the same way a release is: the tool, the library,
      # the completions and every editor's support, the VS Code extension among them -- which needs no
      # npm, since its vendored client is committed like the CLibs tarballs. scripts/test_dist.sh
      # unpacks it elsewhere and uses it, Emacs and Vim included, so a broken archive is found here
      # rather than by the tag that would have published it.
      - name: Build and check the release archive
        run: make test-dist

      # #59: a bounded fuzz run, only if this runner's clang can produce one. A one-line program probes
      # -fsanitize=fuzzer before committing to the real build -- a runner without it is a skip, exactly
      # what the issue asks for, rather than a CI failure nobody installed clang to fix. The probe also
      # decides FUZZ_FLAGS: some images need --gcc-install-dir pointed at a libstdc++ clang would
      # otherwise miss (see the Makefile), found by trying the plain link first and only reaching for it
      # on that specific failure.
      - name: Fuzz
        run: |
          scripts/ci_apt_get.sh install -y -qq --no-install-recommends clang || true
          if ! command -v clang >/dev/null; then
            echo "no clang on this runner -- skipping the fuzz run"
            exit 0
          fi

          probe=$(mktemp --suffix=.c)
          printf 'int LLVMFuzzerTestOneInput(const unsigned char *d, unsigned long n){(void)d;(void)n;return 0;}\n' >"$probe"
          gcc_install_dir=/usr/lib/gcc/x86_64-linux-gnu/13
          flags=""
          if clang -fsanitize=fuzzer,address,undefined -o /tmp/fuzz_probe "$probe" 2>/tmp/fuzz_probe.log; then
            :
          elif grep -q 'cannot find -lstdc++' /tmp/fuzz_probe.log \
              && clang "--gcc-install-dir=$gcc_install_dir" -fsanitize=fuzzer,address,undefined -o /tmp/fuzz_probe "$probe" \
                2>/tmp/fuzz_probe.log; then
            flags="--gcc-install-dir=$gcc_install_dir"
          else
            echo "this runner's clang does not support -fsanitize=fuzzer -- skipping the fuzz run"
            cat /tmp/fuzz_probe.log
            exit 0
          fi

          # Capped like the test suite above (#114): half a minute a target prints nowhere near this.
          scripts/cap_output.sh 50000 make fuzz FUZZ_CC=clang FUZZ_FLAGS="$flags" FUZZ_SECONDS=30

  # Whether this pull request owes the changelog an entry (#90). Its own job because it needs nothing
  # installed and answers in seconds, rather than behind the build. Pull requests only: a push to main is
  # the merge of one that already answered this.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone has no base commit, and a diff against one that is not there reports every
          # file as changed.
          fetch-depth: 0

      - name: A changelog fragment, if one is owed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # With no usable base there is no reliable list of changed paths, and failing a pull request
          # because CI could not work out what it changed is a red check nobody can act on.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::warning::No usable base commit to compare against -- not asking for a changelog entry."
            exit 0
          fi
          # The decision lives in scripts/changelog_required.sh, tested by scripts/test_changelog.sh
          # without opening a pull request. Three dots: what this branch changed since it left the base,
          # not what the base has gained since.
          if git diff --name-only "$base...$head" | scripts/changelog_required.sh; then
            echo "::error::This change has no changelog fragment. See changelog.d/README.md."
            exit 1
          fi

  # Publishes the release a `v*` tag names: the version's section of CHANGELOG.md as its notes, and the
  # one archive attached (#90, #128) -- tool, library, completions and editor support together. After
  # `test`, since a tag is what somebody installs without building it themselves.
  release:
    needs: [test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before anything else: a tag whose version was never written down fails here, rather than
      # publishing a release with an empty page nobody goes back to fill in. `make changelog
      # VERSION=<tag>` is what writes the section; see .forgejo/issue_template/tag.md.
      - name: The changelog has something to say about this version
        run: scripts/changelog_section.sh "${{ github.ref_name }}" > /tmp/release-notes.md

      # The version is the tag, passed rather than left to `git describe`, so the archive's name and
      # what its `frame-dsl --version` prints are the tag whatever the checkout looks like.
      # scripts/test_dist.sh then refuses an archive whose tool or extension says otherwise.
      - name: Build and check the release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/ci_apt_get.sh update -qq
          scripts/ci_apt_get.sh install -y -qq --no-install-recommends build-essential emacs-nox vim-nox jq zip unzip
          make test-dist VERSION_STRING="$TAG"

      - name: Publish the release
        env:
          # The workflow's own token, unless it may not create releases on this instance -- then set
          # FRAMEDSL_RELEASE_TOKEN in the repository's Actions secrets, which only the owner can do.
          TOKEN: ${{ secrets.FRAMEDSL_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          # JSON-encoded by python rather than by hand: release notes are prose full of quotes,
          # backticks and newlines, and a hand-rolled escape gets that wrong exactly once, in public.
          body="$(python3 -c 'import json, sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": open("/tmp/release-notes.md").read()}))' "$TAG")"
          id="$(printf '%s' "$body" \
            | curl -sSf -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
                --data @- "$api/releases" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')"
          echo "Created release $TAG (id $id)."
          for file in build/frame-dsl-"$TAG"-linux-*.tar.gz; do
            echo "Attaching $(basename "$file")"
            curl -sSf -X POST -H "Authorization: token $TOKEN" -F "attachment=@${file}" \
              "$api/releases/${id}/assets?name=$(basename "$file")" > /dev/null
          done
